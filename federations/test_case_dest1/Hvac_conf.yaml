fed_name: Hvac
fed_conf:
  sim_params: # this will also contain the FED_properties inside federate there is a dict key matching
      start_time: '2015-01-01 00:00:00'
      sim_period: 3600 # in seconds the period that will be set in fed properties
      real_period: 3600 # in seconds
      end_period: 86400 # in seconds or datetime
      offset: 0.1
  iteration:
    type: step
    var_order:
      0: { inp: [ "zone.load_s 8674","zone.load_s 8677","zone.load_s 8680","zone.load_s 8692","zone.load_s 73086","zone.fresh_vent_load_s 8674","zone.fresh_vent_load_s 8677","zone.fresh_vent_load_s 8680","zone.fresh_vent_load_s 8692","zone.fresh_vent_load_s 73086" ], out: ["zone.vent_q 8674","zone.vent_q 8677","zone.vent_q 8680","zone.vent_q 8692","zone.vent_q 73086" ] }
      1: { inp: [], out: [ "electrical_power" ] }
#      #      inputs: [["zone.vent_q 8674","zone.vent_q 8677","zone.vent_q 8680","zone.vent_q 8692","zone.vent_q 73086"]]
#      inputs: [["zone.load_s 8674","zone.load_s 8677","zone.load_s 8680","zone.load_s 8692","zone.load_s 73086","zone.fresh_vent_load_s 8674","zone.fresh_vent_load_s 8677","zone.fresh_vent_load_s 8680","zone.fresh_vent_load_s 8692","zone.fresh_vent_load_s 73086"]]
#      outputs: [["zone.vent_q 8674","zone.vent_q 8677","zone.vent_q 8680","zone.vent_q 8692","zone.vent_q 73086"]]
  RL_training: true
  memory : [] # possibilities None no memory, [empty list] memorize all

fed_info:
  core_name: hvac_core
  core_type: zmq

fed_flags:
  TERMINATE_ON_ERROR: true
  UNINTERRUPTIBLE: False
  WAIT_FOR_CURRENT_TIME_UPDATE: False


model_conf:
  generic:
    model_script: dummy_models/Hvac.py
    class_name: Hvac
    n_instances: 1

  model_specific_required:
    inputs_k: ["zone.load_s 8674","zone.load_s 8677","zone.load_s 8680","zone.load_s 8692","zone.load_s 73086","zone.fresh_vent_load_s 8674","zone.fresh_vent_load_s 8677","zone.fresh_vent_load_s 8680","zone.fresh_vent_load_s 8692","zone.fresh_vent_load_s 73086"]
    outputs_k: ["zone.vent_q 8674","zone.vent_q 8677","zone.vent_q 8680","zone.vent_q 8692","zone.vent_q 73086", "electrical_power"]
    #params_k : ['lat', 'param2'] # todo should use the list of params.keys()
    params: {}
    init_state: {}

  model_specific_additional:
    list_rooms: [[8674,8677,8680,8692,73086]]
fed_connections:
  pub:
    0: [      {
        "key": "electrical_power",
        "type": "double",
        "units": "W",
      },
      {
      "key": "actual_power",
      "type": "double",
      "units": "W",
    }
    ]
  end:
    0: [
      {
          "ep_name": "reset_now"
      },
      {
        "ep_name": "actuator"
      },
      {
        "ep_name": "iter_exchange",
        "default": "Envelope/0/iter_exchange"
      }
    ]
  inp: {}
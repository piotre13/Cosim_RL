fed_name: PV
fed_conf:
  sim_params: # this will also contain the FED_properties inside federate there is a dict key matching
      start_time: '2015-01-01 00:00:00'
      sim_period: 3600 # in seconds the period that will be set in fed properties
      real_period: 3600 # in seconds
      end_period: 86400 # in seconds or datetime
      offset: 0.0
  RL_training: true
  memory : [Power_PV, G_H_R, D_H_R] # possibilities None no memory, [empty list] memorize all

fed_info:
  core_name: pv_core
  core_type: zmq

fed_flags:
  TERMINATE_ON_ERROR: true
  UNINTERRUPTIBLE: False
  WAIT_FOR_CURRENT_TIME_UPDATE: True

model_conf:
  generic:
    model_script: model_Dest/PV.py
    class_name: PV
    n_instances: 1

  model_specific_required:
    inputs_k: ['G_H_R','D_H_R', 'Ambient_temperature']
    outputs_k: ['Power_PV']
    #params_k : ['lat', 'param2'] # todo should use the list of params.keys()
    params:
      lat: [ 39.8 ]
      long: [ 116.467 ]
      calc_area: [ 50 ]
      Tilt_angle: [ 0.6981317010 ]
      Azimuth_angle: [ 0.9 ]
      area_ratio: [ 1 ]
      SVF_hori: [ 1 ]
      Reflectance: [ 0.2 ]
      eta_pv_stc: [ 0.21 ] # no longer used todo cancel
      NOCT: [ 45 ]
      Power_rated_pv: [ 410 ]
      length: [ 2.05 ]
      width: [ 1.02 ]
      solar_constant: [ 1353 ]
      std_long: [ 120 ]
    init_state:
      inp.G_H_R: [0.0]
      inp.D_H_R: [0.0]
      inp.Ambient_temperature: [10.0]
      out.Power_PV: [0.0]

  model_specific_additional: {}

fed_connections:
  pub:
    0: [
      {
      "key": "Power_PV",
      "type": "double",
      "units": "W",
      }
    ]
  end: {}
#    0: [
#      {
#          "ep_name": "reset_now"
#      }
#    ]
  inp:
    0: [
      {
      "key": "G_H_R",
      "type": "double",
      "units": "W/m2",
      "targets": ["Weather/0/glohorzrad"]
      },
      {
        "key": "D_H_R",
        "type": "double",
        "units": "W/m2",
        "targets": [ "Weather/0/difhorzrad" ]
      },
      {
        "key": "Ambient_temperature",
        "type": "double",
        "units": "C",
        "targets": [ "Weather/0/drybulb" ]
      }]
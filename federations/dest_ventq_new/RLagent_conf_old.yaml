fed_conf:
  RL_training: true
  episode_period: 1296000
  memory: []
  sim_params:
    end_period: 132192000
    offset: 0.1
    real_period: 3600
    reset_period: 2592000
    sim_period: 3600
    start_time: '2015-01-01 00:00:00'
  training_episodes: 100
fed_connections:
  end:
    0:
    - ep_name: reset_now
  inp:
    0:
    - key: drybulb
      targets:
      - Weather/0/drybulb
      type: double
      units: C
    - key: damp
      targets:
      - Weather/0/damp
      type: double
      units: ''
    - key: glohorzrad
      targets:
      - Weather/0/glohorzrad
      type: double
      units: W/m2
    - key: setpoint
      targets:
      - Controller/0/tSetMax
      type: double
      units: C
    - key: on_off
      targets:
      - Controller/0/ac_on_off
      type: double
      units: ''
    - key: day_of_year
      targets:
      - Controller/0/day_of_year
      type: double
      units: ''
    - key: hour_of_day
      targets:
      - Controller/0/hour_of_day
      type: double
      units: ''
    - key: t_zone_old
      multi_input_handling_method: average
      targets:
      - Envelope/0/zone.ac_t 8674
      - Envelope/0/zone.ac_t 8677
      - Envelope/0/zone.ac_t 8680
      - Envelope/0/zone.ac_t 8692
      - Envelope/0/zone.ac_t 73086
      type: double
      units: C
    - key: t_zone
      targets:
      - Envelope/0/zone.ac_t 8674
      type: double
      units: C
  pub:
    0:
    - key: tset_max
      type: double
      units: C
    - key: tset_min
      type: double
      units: C
    - key: vent_q
      type: double
      units: Wh
fed_flags:
  TERMINATE_ON_ERROR: true
  UNINTERRUPTIBLE: false
fed_info:
  core_name: controllerRL_core
  core_type: zmq
fed_name: RLController
model_conf:
  RL_params:
    BATCH_SIZE: 3000
    EPISODES: 30
    EPS_DECAY: 10000
    EPS_END: 0.05
    EPS_START: 0.9
    GAMMA: 0.9
    LR: 1e-4
    REPLAY_MEMORY: 4000000
    TAU: 0.005
    act_space:
      dtype: float
      high: 30000.0
      low: 0.0
      n_slots: 30
    action_vars:
    - vent_q
    obs_space:
      damp:
        range:
        - 0
        - 50
        type: continous
      drybulb:
        range:
        - -30
        - 50
        type: continous
      glohorzrad:
        range:
        - 0
        - 2000
        type: continous
      hour_of_day:
        range:
        - 0
        - 1
        type: discrete
      setpoint:
        range:
        - 16
        - 20
        type: continous
      t_zone:
        range:
        - 5
        - 30
        type: continous
    observation_vars:
    - damp
    - drybulb
    - glohorzrad
    - hour_of_day
    - setpoint
    - t_zone
    reward_vars:
    - t_zone
  generic:
    class_name: SAC_agent
    model_script: RL_models/SAC_test.py
    n_instances: 1
  model_specific_required:
    init_state:
      out.tSetMax:
      - 20.0
      out.tSetMin:
      - 20.0
    inputs_k:
    - damp
    - drybulb
    - glohorzrad
    - hour_of_day
    - setpoint
    - t_zone
    outputs_k: -vent_q
    params: {}

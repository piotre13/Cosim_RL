fed_conf:
  RL_training: true
  episode_period: 86400
  memory: []
  sim_params:
    end_period: 63072000
    offset: 0.0
    real_period: 3600
    sim_period: 3600
    start_time: '2015-01-01 00:00:00'
  training_episodes: 365
fed_connections:
  end:
    0:
    - ep_name: reset_now
  inp: {}
  pub:
    0:
    - key: tSetMax
      type: double
      units: C
    - key: tSetMin
      type: double
      units: C
    - key: ac_on_off
      type: double
      units: ''
    - key: day_of_year
      type: double
      units: ''
    - key: hour_of_day
      type: double
      units: ''
fed_flags:
  SOURCE_ONLY: false
  TERMINATE_ON_ERROR: true
  UNINTERRUPTIBLE: false
fed_info:
  core_name: controller_core
  core_type: zmq
fed_name: Controller
model_conf:
  generic:
    class_name: Controller
    model_script: dummy_models/Controller_dummy.py
    n_instances: 1
  model_specific_additional: {}
  model_specific_required:
    init_state:
      out.ac_on_off:
      - 1
      out.tSetMax:
      - 20.0
      out.tSetMin:
      - 20.0
    inputs_k: []
    outputs_k:
    - tSetMax
    - tSetMin
    - ac_on_off
    params: {}

fed_conf:
  RL_training: true
  episode_period: 172800
  memory: []
  sim_params:
    end_period: 65664000
    offset: 1
    real_period: 3600
    reset_period: 2592000
    sim_period: 3600
    start_time: '2015-01-01 00:00:00'
  training_episodes: 365
rl_conf:
  training: true
  training_episodes: 100
  episode_period: 1296000
  reset_period: 2592000
  test_period: 1296000
fed_connections:
  end:
    0:
    - ep_name: reset_now
  inp:
    0:
    - key: drybulb
      targets:
      - Weather/0/drybulb
      type: double
      units: C
    - key: humidity
      targets:
      - Weather/0/damp
      type: double
      units: ''
    - key: solar_radiation
      targets:
      - Weather/0/glohorzrad
      type: double
      units: W/m2
    - key: t_set
      targets:
      - Controller/0/tSetMax
      type: double
      units: C
    - key: day_night
      targets:
      - Controller/0/ac_on_off
      type: double
      units: ''
    - key: hour_of_day
      targets:
      - Controller/0/hour_of_day
      type: double
      units: ''
    - key: t_zone
      targets:
      - Envelope/0/zone.ac_t 8674
      type: double
      units: C
  pub:
    0:
    - key: vent_q
      type: double
      units: Wh
fed_flags:
  TERMINATE_ON_ERROR: true
  UNINTERRUPTIBLE: false
fed_info:
  core_name: controllerRL_core
  core_type: zmq
fed_name: RLController
observation_space:
  type: Dict
  spaces:
    drybulb:
      type: Box
      low: -20.0
      high: 50.0
      dtype: float32
    humidity:
      type: Box
      low: 0.0
      high: 100.0
      dtype: float32
    solar_radiation:
      type: Box
      low: 0.0
      high: 1000.0
      dtype: float32
    t_zone:
      type: Box
      low: 0.0
      high: 50.0
      dtype: float32
    t_set:
      type: Box
      low: 16.0
      high: 21.0
      dtype: float32
    day_night:
      type: Discrete
      n: 2
action_space:
  type: Box
  low: 0.0
  high: 30000.0
  dtype: float32
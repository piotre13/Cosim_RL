fed_name: Battery
fed_conf:
  sim_params: # this will also contain the FED_properties inside federate there is a dict key matching
      start_time: '2015-01-01 00:00:00'
      sim_period: 3600 # in seconds the period that will be set in fed properties
      real_period: 3600 # in seconds
      end_period: 86400 # in seconds or datetime
      offset: 0.2
  RL_training: true
  memory : [SOC, energy_out, power] # possibilities None no memory, [empty list] memorize all

fed_info:
  core_name: battery_core
  core_type: zmq

fed_flags:
  TERMINATE_ON_ERROR: true
  UNINTERRUPTIBLE: False
  WAIT_FOR_CURRENT_TIME_UPDATE: False

model_conf:
  generic:
    model_script: model_Dest/Battery.py
    class_name: Battery
    n_instances: 1

  model_specific_required:
    inputs_k: ['power']
    outputs_k: ['energy_out']
    #params_k : ['lat', 'param2'] # todo should use the list of params.keys()
    params:
      rated_capacity: [ 40000 ]
      maximum_charge_power: [ 8000 ]
      maximum_discharge_power: [ 8000 ]
      SOC_upper_limit: [ 0.95 ]
      SOC_lower_limit: [ 0.25 ]
      charge_efficiency: [ 1 ]
      discharge_efficiency: [ 1 ]
      self_discharge_rate: [ 0 ]
      SOC: [ 0.25 ]
    init_state:
      inp.power: [0.0]
      out.energy_out: [0.0]

  model_specific_additional: {}

fed_connections:
  pub:
    0: [
      {
      "key": "energy_out",
      "type": "double",
      "units": "Wh",
      }
    ]
  end:
    0: [
      {
          "ep_name": "reset_now"
      }
    ]
  inp:
    0: [
      {
      "key": "power",
      "type": "double",
      "units": "W",
      "multi_input_handling_method": "sum",
      "targets": [
        "PV/0/Power_PV",
        "Hvac/0/electrical_power"
      ]
      }]